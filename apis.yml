aid: 3d-robotics
name: 3DR
description: '3DR, Inc. is an American designer and manufacturer of electronic systems
  for unmanned vehicles, drones and UAVs, based in Chula Vista, California, and focused
  on open-source and open-hardware flight control: Control N1 / Control Zero / Pixracer
  Pro autopilots, Location One and ZED-F9P RTK GNSS receivers, SiK and Dualband Wi-Fi
  telemetry radios, DroneCAN power modules and sensors, ESCs, and an ArduRemoteID-based
  Remote ID module. The company states on its own site that "3DR Inc was a distinct
  entity before the year 2023" and does not support products sold under the earlier
  3D Robotics label (Solo, Site Scan, DroneKit). Its published surface is a hardware
  knowledge base and a storefront; it operates no public web API.'
