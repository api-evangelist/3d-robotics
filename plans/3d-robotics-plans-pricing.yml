note: >-
  3DR publishes no API plans, tiers, quotas or usage pricing, because it sells no
  API. Its commercial surface is a BigCommerce hardware storefront at
  store.3dr.com with per-unit product pricing (autopilots, GNSS receivers,
  telemetry radios, power modules, ESCs), plus a purchase-order and reseller
  path documented at https://docs.3dr.com/orders-and-shipping/how-to-place-an-order-using-po
  and https://docs.3dr.com/orders-and-shipping/how-to-become-a-reseller. That is
  product pricing, not API pricing, so no `Pricing` or `Plans` pointer is wired
  into apis.yml — pointing the rating's API pricing check at a hardware catalog
  would assert a commercial API surface the company does not operate.
