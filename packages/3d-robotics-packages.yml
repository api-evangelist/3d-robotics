attribution_note: >-
  ENTITY CAVEAT — read before treating these as 3DR SDKs. Every package below was
  published by the PRE-2023 3D Robotics, Inc. (registry metadata names
  "3D Robotics" as author and tim@3drobotics.com as the maintainer address, which
  is first-party). The company now trading as 3DR, Inc. at 3dr.com states on its
  own FAQ that "3DR Inc was a distinct entity before the year 2023" and that it
  provides no support for products sold under the earlier 3DR label
  (https://www.3dr.com/, 200). No `SDKs` pointer is wired into apis.yml for this
  file: these libraries are abandoned (last release 2019-03-18), they wrap a web
  API whose host no longer resolves, and the current entity disclaims them.
  Crediting today's 3DR with a maintained SDK program on this evidence would be a
  misattribution. The artifact is kept because a dated, first-party abandonment
  signal is exactly the decay evidence this pipeline exists to record.
