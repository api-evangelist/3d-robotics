conformance:
- id: ndaa-section-848
  name: National Defense Authorization Act (NDAA) supply-chain compliance
  category: regulatory
  conforms: true
  evidence: https://docs.3dr.com/irc/ndaa
  detail: >-
    "3DR, Inc hereby confirms its commitment to compliance with the National
    Defense Authorization Act (NDAA) regulations… 3DR, Inc does not engage in
    transactions with entities identified as restricted under the NDAA, including
    those listed on the U.S. Department of Commerce Entity List, the U.S.
    Department of Defense List of Communist Chinese Military Companies." Page
    states "Last updated: Feb 2, 2023". This is a self-declared compliance
    notice, not a third-party audit or certification.
- id: faa-remote-id-part-89
  name: FAA Remote Identification (14 CFR Part 89)
  category: regulatory
  conforms: true
  evidence: https://3dr.wiki/telemetry/remote-id/
  detail: >-
    3DR ships a dedicated Remote ID module documented against the ArduPilot
    ArduRemoteID open-source implementation, with CAN / UART / USB / Wi-Fi
    interfaces and pinouts published. The docs point at
    https://ardupilot.org/plane/docs/common-remoteid.html and
    https://github.com/ArduPilot/ArduRemoteID. Note the specification table on
    that page still carries "TBD" for receiver sensitivity, transmit power and
    data rates.
- id: dronecan
  name: DroneCAN (UAVCAN v0) peripheral bus
  category: domain-standard
  conforms: true
  evidence: https://3dr.wiki/guides/dronecan/
  detail: >-
    DroneCAN is the wire protocol across 3DR's peripheral line — CAN GNSS
    (Location One, ZED-F9P CAN), CAN power modules, CAN airspeed, CAN Node F303,
    CAN PWM adapter and KitCAN. The guide documents node-ID assignment, dynamic
    node allocation, bootloader update and node-status ("OPERATIONAL") handling.
    This is the closest thing 3DR has to a machine interface, and it is a
    hardware bus rather than a network API — there is no published schema file to
    save.
- id: mavlink
  name: MAVLink micro air vehicle protocol
  category: domain-standard
  conforms: true
  evidence: https://3dr.wiki/guides/dronecan/
  detail: >-
    The autopilots and SiK telemetry radios expose MAVLink; the DroneCAN guide
    documents the MAVLINK and CAN serial ports the device enumerates. 3DR does
    not publish a MAVLink dialect XML of its own — the dialects live upstream in
    ArduPilot/PX4 — so no dialect definition is captured in this repo.
