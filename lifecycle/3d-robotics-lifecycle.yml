summary: >-
  3DR publishes no API, and therefore no API lifecycle policy. What this file
  records instead is the one lifecycle fact that matters for a catalog reader:
  the web API 3D Robotics did once publish is decommissioned, and the corporate
  entity behind it is not the entity trading as 3DR today.
api_versioning:
  scheme: null
  status: not-applicable
  note: No public web API exists on any 3DR host; nothing to version.
deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    No deprecation or Sunset/Deprecation (RFC 8594) policy is published. No
    `Deprecation` pointer is wired in apis.yml, because there is no policy to
    point at.
status_page:
  published: false
  url: null
  note: >-
    No status page found on 3dr.com, docs.3dr.com, 3dr.wiki or store.3dr.com, and
    no status subdomain resolves. No `StatusPage` pointer is wired.
sla:
  published: false
  note: >-
    The published commitments are hardware commercial terms — lead times, RMA /
    returns, reseller and purchase-order process — not a service-level agreement.
    See https://docs.3dr.com/orders-and-shipping/lead-times and
    https://docs.3dr.com/orders-and-shipping/rma.
hardware_lifecycle:
  published: true
  note: >-
    The one lifecycle surface 3DR does publish is for HARDWARE: the knowledge base
    carries an explicit "Discontinued" section under GNSS (Classic M8N IST8310,
    MosaicX5), which is a genuine, dated end-of-life signal for products rather
    than for an API.
